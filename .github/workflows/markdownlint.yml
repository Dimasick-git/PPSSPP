name: Markdown Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  md_lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: articulate/actions-markdownlint@v1
        with:
          config: .github/markdownlint.yml
          files: '**/*.md'
          ignore: node_modules
          fix: false
