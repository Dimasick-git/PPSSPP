# Конфигурация markdownlint
default: true

# MD013 - ограничение длины строки
MD013:
  line_length: 120        # Увеличиваем лимит до 120 символов
  heading_line_length: 120
  code_block_line_length: 120
  code_blocks: false      # Не проверять блоки кода
  tables: false           # Не проверять таблицы

# MD033 - разрешить HTML теги
MD033:
  allowed_elements:
    - br
    - details
    - summary
    - img
    - p

# MD041 - первая строка должна быть H1
MD041:
  level: 1

# MD012 - не более 1 пустой строки подряд
MD012:
  maximum: 1

# MD034 - запрет голых URL (оборачивать в <>  или [text](url))
MD034: true

# MD032 - списки должны быть окружены пустыми строками
MD032: true

# MD022 - заголовки должны быть окружены пустыми строками
MD022: true

# MD009 - запрет trailing spaces
MD009:
  br_spaces: 2            # Разрешить 2 пробела для <br>
  strict: false
